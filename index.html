<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/aje-logo-dark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Ajé Imobiliária | Imóveis em Pipa, RN e Litoral do Nordeste</title>
    <meta
      name="description"
      content="Imobiliária boutique em Pipa, Tibau do Sul, Natal e João Pessoa. Venda, aluguel e terrenos com apoio jurídico completo. 35 anos de experiência local."
    />
    <!-- meta keywords removida: o Google a ignora há mais de uma década -->
    <link rel="canonical" href="https://www.ajeimobiliaria.com/" />

    <!-- Hreflang: as tags reais são inseridas dinamicamente por página (ver
         src/utils/seoHead.js), já que o site é uma SPA e cada rota precisa
         apontar para a SUA PRÓPRIA versão em cada idioma (home, imóvel,
         etc). Não duplicar aqui estaticamente — isso poluiria as páginas
         internas com hreflangs apontando sempre para a home. -->

    <!-- Open Graph -->
    <meta property="og:title" content="Ajé Imobiliária | Imóveis em Pipa, RN e Litoral do Nordeste" />
    <meta
      property="og:description"
      content="Imobiliária boutique em Pipa, Tibau do Sul, Natal e João Pessoa. Venda, aluguel e terrenos com apoio jurídico completo."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://www.ajeimobiliaria.com/" />
    <meta property="og:image" content="https://www.ajeimobiliaria.com/images/aje-logo.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ajé Imobiliária | Imóveis em Pipa, RN e Litoral do Nordeste" />
    <meta
      name="twitter:description"
      content="Imobiliária boutique em Pipa, Tibau do Sul, Natal e João Pessoa. 35 anos de experiência local."
    />

    <!-- Dados estruturados: RealEstateAgent + LocalBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "RealEstateAgent",
      "name": "Ajé Imobiliária",
      "alternateName": ["Ajé Imóveis", "AjéImóveis", "Aje Imobiliaria"],
      "description": "Imobiliária boutique no litoral do Nordeste brasileiro, com 35 anos de experiência local. Especialistas em Praia da Pipa e região.",
      "url": "https://www.ajeimobiliaria.com/",
      "telephone": "+5584994766720",
      "image": "https://www.ajeimobiliaria.com/images/aje-logo.png",
      "priceRange": "$$-$$$",
      "sameAs": [
        "https://www.instagram.com/ajeimobiliaria",
        "https://www.tiktok.com/@ajeimobiliaria"
      ],
      "areaServed": [
        "Natal", "João Pessoa", "Praia da Pipa", "Pipa Beach", "Sibaúma",
        "Baía Formosa", "Barra do Cunhaú", "Redinha", "Tibau do Sul"
      ],
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Tibau do Sul",
        "addressRegion": "RN",
        "addressCountry": "BR"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
